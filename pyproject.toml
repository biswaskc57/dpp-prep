[project]
name = "dpp-prep"
version = "0.3.2"
description = "AI-assisted preparation of DPP-relevant manufacturing information with evidence, checks, review and controlled approval"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "pyyaml", "jsonschema>=4", "pymupdf>=1.24"]

[project.optional-dependencies]
ai = ["langextract>=1.7"]
ui = ["streamlit>=1.40", "pandas"]
dev = ["pytest", "langextract>=1.7", "streamlit>=1.40", "pandas"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
