# Expected behaviour, written before running the tool. Each entry names the
# executable test that checks it. Inputs: baseline set + ERP record, with at
# most one document replaced by a variant.
T01:  {test: test_T01_all_seven_elements_checked_on_baseline, input: baseline, expect: "all seven elements CHECKED; every proposal has a document fingerprint"}
T01b: {test: test_T01b_import_route_uses_no_ai, input: baseline, expect: "E01, E02, E05 imported without AI; E03, E04, E06, E07 proposed by the extractor"}
T02:  {test: test_T02_missing_value_stays_unresolved, input: [V1_D1_uw_missing, V1_D3_uw_missing], expect: "E06 UNRESOLVED"}
T02b: {test: test_T02b_invented_value_is_dropped_and_kept_in_the_diary, input: [V1_D1_uw_missing, V1_D3_uw_missing], expect: "invented value dropped, kept as rejected, recorded in diary; E06 UNRESOLVED"}
T03:  {test: test_T03_conflict_flagged_then_resolved_by_reviewer_choice, input: V2_D3_uw_conflict, expect: "E06 FLAGGED; reviewer selects 1.1; 1.3 kept as rejected; 1.1 released"}
T04:  {test: test_T04_wrong_scope_flagged_and_cannot_be_accepted, input: V3_D3_uw_other_size, expect: "E06 FLAGGED; reviewer cannot accept the wrongly scoped value"}
T05:  {test: test_T05_wrong_product_flagged, input: V4_D2_wrong_product, expect: "E03 FLAGGED by identity check"}
T06:  {test: test_T06_failed_check_blocks_review_approval_and_export, input: V5_D2_composition_95, expect: "E03 FLAGGED; review, approval and export all refused"}
T07:  {test: test_T07_only_the_approver_role_can_approve, input: baseline, expect: "AI, reviewer and system cannot approve"}
T07b: {test: test_T07b_same_person_cannot_review_and_approve, input: baseline, expect: "reviewer cannot approve own review"}
T07c: {test: test_T07c_review_requires_confirmed_evidence_inspection, input: baseline, expect: "review refused unless evidence inspection is confirmed"}
T08:  {test: test_T08_export_contains_only_approved_and_passes_schema, input: V4_D2_wrong_product, expect: "E03 excluded; six elements exported; file passes schema; reviewer and approver named"}
T09:  {test: test_U01_value_is_shown_beside_its_source_sentence, input: screen, expect: "value shown beside its quote; now automated as U01"}
T11:  {test: test_T11_real_quote_about_the_wrong_attribute_does_not_support_value, input: V6_D1_ug_only, expect: "Ug quote cannot support a Uw value; support check fails"}
T12:  {test: test_T12_approval_is_bound_to_the_exact_version, input: baseline, expect: "value changed after approval is excluded from release"}
T13:  {test: test_T13_correction_restarts_checks_review_and_approval, input: baseline, expect: "correction clears review and approval, reruns checks; unsupported correction refused"}
T14:  {test: test_T14_diary_persists_every_step, input: baseline, expect: "diary survives reopening; refusals and approvals recorded; no edit or delete function"}
P01:  {test: test_P01_pdf_baseline_all_elements_checked, input: PDF baseline, expect: "all seven elements CHECKED from PDFs"}
P02:  {test: test_P02_evidence_names_the_page, input: PDF baseline, expect: "E06 evidence: datasheet page 1, report page 2"}
P03:  {test: test_P03_pdf_conflict_still_flagged, input: PDF V2_D3_uw_conflict, expect: "E06 FLAGGED"}
L01:  {test: test_L01_adapter_output_passes_the_same_controls, input: baseline via LangExtract-shaped fake, expect: "all CHECKED; AI proposals attributed to the model"}
L02:  {test: test_L02_unanchored_model_output_is_discarded_but_recorded, input: fake with unanchored 0.8, expect: "0.8 discarded; raw output in diary"}
L03:  {test: test_L03_one_call_per_document_with_prompt_and_foreign_examples, input: baseline, expect: "3 calls; prompt forbids inference; examples use D-200, not W-100"}
L04:  {test: test_L04_example_extractions_are_exact_substrings_of_the_example_text, input: examples file, expect: "all example extractions found in example text"}
L05:  {test: test_L05_empty_extraction_is_not_treated_as_grounded, input: empty extraction, expect: "not anchored"}
U01:  {test: test_U01_value_is_shown_beside_its_source_sentence, input: screen, expect: "Uw quote highlighted in context (T09 automated)"}
U02:  {test: test_U02_no_value_preselected_and_inspection_box_unticked, input: screen, expect: "no default choice; box unticked"}
U03:  {test: test_U03_accepting_without_inspection_is_refused, input: screen, expect: "refusal shown; state unchanged"}
U04:  {test: test_U04_review_then_approve_by_different_person_then_release, input: screen, expect: "same-person approval refused; different approver succeeds; release contains E07"}
U05:  {test: test_U05_pdf_scenario_shows_page_numbers, input: screen, PDF, expect: "page 2 shown"}
E01:  {test: test_E01_runner_with_langextract_adapter_keeps_every_run, input: runner, 2 runs, expect: "every run kept; all outcomes as expected"}
