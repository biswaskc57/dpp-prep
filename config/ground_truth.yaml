  # ------------------------------------------------------- realistic tier
  R1_datasheet:
    product: W-100
    statements:
      - {element: E04, value: "triple glazing 4-16-4-16-4, two low-e coatings, argon filled", quote: "triple glazing 4-16-4-16-4, two low-e coatings, argon filled."}
