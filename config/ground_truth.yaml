    distractors:
      - {element: E06, value: "1.0", why: "Uw of the W-100 XL variant at 1480 × 1780 mm"}
      - {element: E06, value: "0.5", why: "centre-of-glass Ug"}
      - {element: E06, value: "1.2", why: "frame Uf"}
      - {element: E07, value: "NW-PR-2025-031", why: "replaced report"}
  R2_supplier_declaration:
    product: W-100
    statements:
      - {element: E03, value: "pine wood 78 %, aluminium 18 %, EPDM seals 3 %, steel fittings 1 %.", quote: "pine wood 78 %, aluminium 18 %, EPDM seals 3 %, steel fittings 1 %."}
    distractors:
      - {element: E03, value: "74 21 4 1", why: "sash profile set, not frame"}
      - {element: E03, value: "35", why: "recycled aluminium content"}
  R2b_supplier_declaration_sash_only:
    product: W-100
    statements: []
    distractors:
      - {element: E03, value: "74 21 4 1", why: "sash profile set, not frame"}
  R3_performance_report:
    product: W-100
    statements:
      - {element: E04, value: "triple glazing 4-16-4-16-4, two low-e coatings, argon filled", quote: "triple glazing 4-16-4-16-4, two low-e coatings, argon filled"}
      - {element: E06, value: "1.1", unit: "W/(m2K)", scope: "1230 x 1480 mm", quote: "Uw = 1.1 W/(m2K)"}
      - {element: E06, value: "1.2", unit: "W/(m2K)", scope: "1000 x 1200 mm", quote: "the calculated value is Uw = 1.2 W/(m2K)"}
      - {element: E07, value: "NW-PR-2026-014", quote: "| Report ID | NW-PR-2026-014 |"}
    distractors:
      - {element: E06, value: "0.5", why: "Ug input value"}
      - {element: E07, value: "NW-PR-2025-031", why: "replaced report"}
