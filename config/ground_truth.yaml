# Ground truth for the W-100 fixture (v0.3.1). Written 12 Oct 2026 BEFORE any
# local model saw the realistic documents.
#
# documents:   what each document states, element by element.
#   product    the product identifier the document is about
#   statements faithful statements a correct extractor would propose
#              (quote = exact text in the document; scope as written there)
#   distractors values in the document that belong to something else
#              (another product variant, Ug/Uf, a replaced report, the sash)
# truth:       per scenario, the value that SHOULD finally be released, or null
#              when no value can correctly be released from these documents.
# Elements E01, E02, E05 come from the ERP record (no AI) and are not listed.

documents:
  # ---------------------------------------------------------- simple tier
  D1_datasheet:
    product: W-100
    statements:
      - {element: E04, value: "triple glazing 4-16-4-16-4, two low-e coatings, argon filled", quote: "triple glazing 4-16-4-16-4, two low-e coatings, argon filled."}
      - {element: E06, value: "1.1", unit: "W/(m2K)", scope: "1230 x 1480 mm", quote: "Uw = 1.1 W/(m2K) for reference size 1230 x 1480 mm."}
      - {element: E07, value: "NW-PR-2026-014", quote: "Declared in performance report NW-PR-2026-014."}
  D2_supplier_declaration:
    product: W-100
    statements:
      - {element: E03, value: "Pine wood 78 %, aluminium 18 %, EPDM seals 3 %, steel fittings 1 %.", quote: "Pine wood 78 %, aluminium 18 %, EPDM seals 3 %, steel fittings 1 %."}
