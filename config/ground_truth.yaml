    statements:
      - {element: E06, value: "1.1", unit: "W/(m²·K)", scope: "", quote: "| Thermal transmittance | Uw = 1,1 W/(m²·K) |"}
      - {element: E07, value: "NW-PR-2026-014", quote: "test report NW-PR-2026-014"}
  R5_old_performance_report:
    product: W-100
    statements:
      - {element: E04, value: "triple glazing 4-14-4-14-4, one low-e coating, argon filled", quote: "triple glazing 4-14-4-14-4, one low-e coating, argon filled"}
      - {element: E06, value: "1.2", unit: "W/(m2K)", scope: "1230 x 1480 mm", quote: "Uw = 1.2 W/(m2K)"}
      - {element: E07, value: "NW-PR-2025-031", quote: "| Report ID | NW-PR-2025-031 |"}

truth:
